name: Build GrupoND macOS Versions

# Gera 2 .dmg NÃO assinados:
#   - Apple Silicon (M1/M2/M3...) -> runner macos-14
#   - Intel (x86_64)              -> runner macos-15-intel
# Por não ter assinatura, na 1ª execução o usuário abre com
# botão direito no .app -> "Abrir" (contorna o Gatekeeper).

on:
  workflow_dispatch:
    inputs:
      rs_server:
        description: 'Endereço do Servidor ID/Relay'
        required: true
        default: 'rustdesk.grupond.tv.br'
      rs_key:
        description: 'Chave Pública do Servidor (Public Key)'
        required: false
        default: '05Q9aFxELHvLZ4ZF4IxFyBq1rYjIvf2xV5j7qcKYrJQ='

env:
  # 1.81 é obrigatório no macOS (dependência cidre exige), ver flutter-build.yml upstream
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  build-macos:
    name: Build macOS ${{ matrix.job.arch }} (${{ matrix.version }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        version: [client, admin]
        job:
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
              extra-build-args: "--screencapturekit",
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              arch: x86_64,
              vcpkg-triplet: x64-osx,
              extra-build-args: "",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Environment Variables
        shell: bash
        run: |
          if [ "${{ matrix.version }}" == "client" ]; then
            echo "APP_NAME=Atendimento GrupoND" >> $GITHUB_ENV
            echo "RS_INCOMING_ONLY=1" >> $GITHUB_ENV
            echo "RS_DISABLE_SETTINGS=1" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Atendimento_GrupoND" >> $GITHUB_ENV
          else
            echo "APP_NAME=Admin GrupoND" >> $GITHUB_ENV
            echo "RS_HIDE_NETWORK=1" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Admin_GrupoND" >> $GITHUB_ENV
          fi
          echo "RS_SERVER=${{ github.event.inputs.rs_server }}" >> $GITHUB_ENV
          if [ "${{ github.event.inputs.rs_key }}" != "" ]; then
            echo "RS_PUB_KEY=${{ github.event.inputs.rs_key }}" >> $GITHUB_ENV
          fi

      - name: Install build runtime
        run: |
          brew install llvm create-dmg nasm || true
          if command -v pkg-config &>/dev/null; then
            echo "pkg-config já instalado"
          else
            brew install pkg-config
          fi

      - name: Install NASM 2.16 (aom exige NASM 2.x, não 3.x)
        if: matrix.job.arch == 'x86_64'
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch Flutter
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [ "${{ env.FLUTTER_VERSION }}" == "3.24.5" ]; then
            git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" || true
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' \
            ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - name: Prepare vcpkg manifest (macOS)
        shell: bash
        run: |
          # Em macOS removemos os codecs de GPU x86 (amd-amf / ffnvcodec / mfx-dispatch
          # e as features amf/nvcodec/qsv do ffmpeg), não suportados em osx.
          cat > vcpkg.json <<'EOF'
          {
            "dependencies": [
              "aom",
              "libjpeg-turbo",
              "opus",
              "libvpx",
              "libyuv",
              "ffmpeg"
            ],
            "vcpkg-configuration": {
              "default-registry": {
                "kind": "builtin",
                "baseline": "120deac3062162151622ca4860575a33844ba10b"
              },
              "overlay-ports": [
                "./res/vcpkg"
              ]
            }
          }
          EOF

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "$f:"; echo "======"; cat "$f"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Generate Flutter Rust Bridge
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --rust-output ./src/bridge_generated.rs \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Generate macOS app icon (AppIcon.icns)
        shell: bash
        run: |
          ICON=res/mac-icon.png
          SET=AppIcon.iconset
          mkdir -p "$SET"
          sips -z 16 16   "$ICON" --out "$SET/icon_16x16.png"
          sips -z 32 32   "$ICON" --out "$SET/icon_16x16@2x.png"
          sips -z 32 32   "$ICON" --out "$SET/icon_32x32.png"
          sips -z 64 64   "$ICON" --out "$SET/icon_32x32@2x.png"
          sips -z 128 128 "$ICON" --out "$SET/icon_128x128.png"
          sips -z 256 256 "$ICON" --out "$SET/icon_128x128@2x.png"
          sips -z 256 256 "$ICON" --out "$SET/icon_256x256.png"
          sips -z 512 512 "$ICON" --out "$SET/icon_256x256@2x.png"
          sips -z 512 512 "$ICON" --out "$SET/icon_512x512.png"
          cp "$ICON"      "$SET/icon_512x512@2x.png"
          iconutil -c icns "$SET" -o flutter/macos/Runner/AppIcon.icns
          ls -la flutter/macos/Runner/AppIcon.icns

      - name: Build rustdesk
        shell: bash
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create unsigned dmg
        shell: bash
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg \
            --icon "RustDesk.app" 200 190 \
            --hide-extension "RustDesk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "${{ env.OUTPUT_NAME }}_${{ matrix.job.arch }}.dmg" \
            ./flutter/build/macos/Build/Products/Release/RustDesk.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}_${{ matrix.job.arch }}_macos
          path: ${{ env.OUTPUT_NAME }}_${{ matrix.job.arch }}.dmg
