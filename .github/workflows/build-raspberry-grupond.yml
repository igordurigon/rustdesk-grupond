name: Build GrupoND Raspberry Pi Versions

on:
  workflow_dispatch:
    inputs:
      rs_server:
        description: 'Endereço do Servidor ID/Relay (ex: rustdesk.grupond.com.br)'
        required: true
        default: 'rustdesk.grupond.com.br'
      rs_key:
        description: 'Chave Pública do Servidor (Public Key)'
        required: false
        default: '05Q9aFxELHvLZ4ZF4IxFyBq1rYjIvf2xV5j7qcKYrJQ='

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux-arm:
    name: Build Linux ${{ matrix.job.arch }} (${{ matrix.version }})
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        version: [client]
        job:
          - {
              arch: aarch64,
              target: aarch64-unknown-linux-gnu,
              deb_arch: arm64,
              ui: flutter,
              vcpkg-triplet: arm64-linux,
            }
          - {
              arch: armv7,
              target: armv7-unknown-linux-gnueabihf,
              deb_arch: armhf,
              ui: sciter,
              sciter_arch: arm32,
              vcpkg-triplet: arm-linux,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Set Environment Variables
        shell: bash
        run: |
          if [ "${{ matrix.version }}" == "client" ]; then
            echo "APP_NAME=Atendimento GrupoND" >> $GITHUB_ENV
            echo "RS_INCOMING_ONLY=1" >> $GITHUB_ENV
            echo "RS_DISABLE_SETTINGS=1" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Atendimento_GrupoND" >> $GITHUB_ENV
          else
            echo "APP_NAME=Admin GrupoND" >> $GITHUB_ENV
            echo "RS_HIDE_NETWORK=1" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Admin_GrupoND" >> $GITHUB_ENV
          fi
          echo "RS_SERVER=${{ github.event.inputs.rs_server }}" >> $GITHUB_ENV
          if [ "${{ github.event.inputs.rs_key }}" != "" ]; then
            echo "RS_PUB_KEY=${{ github.event.inputs.rs_key }}" >> $GITHUB_ENV
          fi

      - uses: rustdesk-org/run-on-arch-action@amd64-support
        name: Build within QEMU Container
        with:
          arch: ${{ matrix.job.arch }}
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          install: |
            apt-get update -y
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-12-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpam0g-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-12-dev \
               nasm \
               ninja-build \
               pkg-config \
               python3 \
               rpm \
               unzip \
               zip \
               wget \
               xz-utils \
               libssl-dev \
               sudo
          run: |
            # Fix git safe directory
            git config --global --add safe.directory "*"
            
            # Install Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ env.RUST_VERSION }}
            source $HOME/.cargo/env
            
            # Setup vcpkg (building from source in container as no ARM prebuilts)
            export VCPKG_ROOT=/opt/vcpkg
            git clone https://github.com/microsoft/vcpkg $VCPKG_ROOT
            pushd $VCPKG_ROOT
            git reset --hard ${{ env.VCPKG_COMMIT_ID }}
            ./bootstrap-vcpkg.sh -disableMetrics
            popd
            
            # Create a clean vcpkg.json for ARM (using standard vcpkg ports)
            echo "{
              \"dependencies\": [
                \"aom\",
                \"libjpeg-turbo\",
                \"opus\",
                \"libvpx\",
                \"libyuv\",
                \"x264\",
                {
                  \"name\": \"ffmpeg\",
                  \"features\": [\"opus\", \"vpx\", \"x264\"],
                  \"default-features\": false
                }
              ],
              \"vcpkg-configuration\": {
                \"default-registry\": {
                  \"kind\": \"builtin\",
                  \"baseline\": \"120deac3062162151622ca4860575a33844ba10b\"
                }
              }
            }" > /workspace/vcpkg.json
            
            # Build dependencies with vcpkg using the manifest
            $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"

            # Build Logic
            cd /workspace
            export DEB_ARCH=${{ matrix.job.deb_arch }}
            
            if [ "${{ matrix.job.ui }}" == "flutter" ]; then
              # Setup Flutter
              pushd /opt
              wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
              tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
              export PATH=$PWD/flutter/bin:$PATH
              popd
              
              # Setup flutter_rust_bridge
              cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
              pushd flutter
              flutter pub get
              popd
              flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --rust-output ./src/bridge_generated.rs
              
              # Build Flutter version
              python3 build.py --flutter --hwcodec
              
              # Rename resulting deb
              mv rustdesk-*.deb ${{ env.OUTPUT_NAME }}_${{ matrix.job.deb_arch }}.deb
            else
              # Build Sciter version
              python3 res/inline-sciter.py
              cargo build --features inline,hwcodec --release
              
              # Package Sciter version
              mkdir -p ./Release
              cp target/release/rustdesk ./Release/rustdesk
              wget -O ./Release/libsciter-gtk.so https://github.com/c-smile/sciter-sdk/raw/master/bin.lnx/${{ matrix.job.sciter_arch }}/libsciter-gtk.so
              
              python3 build.py --package ./Release
              
              # Rename resulting deb
              mv rustdesk-*.deb ${{ env.OUTPUT_NAME }}_${{ matrix.job.deb_arch }}.deb
            fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}_${{ matrix.job.deb_arch }}
          path: |
            ${{ env.OUTPUT_NAME }}_${{ matrix.job.deb_arch }}.deb
