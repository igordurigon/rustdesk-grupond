name: Build GrupoND Versions

on:
  workflow_dispatch:
    inputs:
      rs_server:
        description: 'Endereço do Servidor ID/Relay (ex: rustdesk.grupond.com.br)'
        required: true
        default: 'SEU_IP_OU_DOMINIO'

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  # Flags para resolver erros de exceção C++ no hwcodec e silenciar avisos do vcpkg
  CL: "/EHsc /d2FH4-"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build-windows:
    name: Build Windows Versions
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        version: [client, admin]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        shell: pwsh
        run: |
          if ("${{ matrix.version }}" -eq "client") {
            echo "APP_NAME=Atendimento GrupoND" >> $env:GITHUB_ENV
            echo "RS_INCOMING_ONLY=1" >> $env:GITHUB_ENV
            echo "RS_DISABLE_SETTINGS=1" >> $env:GITHUB_ENV
            echo "OUTPUT_NAME=Atendimento_GrupoND" >> $env:GITHUB_ENV
          } else {
            echo "APP_NAME=Admin GrupoND" >> $env:GITHUB_ENV
            echo "RS_HIDE_NETWORK=1" >> $env:GITHUB_ENV
            echo "OUTPUT_NAME=Admin_GrupoND" >> $env:GITHUB_ENV
          }
          echo "RS_SERVER=${{ github.event.inputs.rs_server }}" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup vcpkg dependencies
        shell: pwsh
        run: |
          # Garante que o vcpkg use os ports customizados do RustDesk
          # O modo manifesto é acionado automaticamente se rodarmos 'vcpkg install' na raiz
          # No entanto, vamos forçar a instalação das dependências usando o vcpkg do sistema
          # mas respeitando os overlays ports definidos no vcpkg.json
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet x64-windows-static --vcpkg-root "$env:VCPKG_INSTALLATION_ROOT" --x-manifest-root="${{ github.workspace }}" --x-install-root="${{ github.workspace }}/vcpkg_installed"
          
          # Configura variáveis de ambiente para o build do Rust encontrar as libs instaladas no workspace
          $vcpkg_installed = "${{ github.workspace }}/vcpkg_installed/x64-windows-static"
          echo "INCLUDE=$vcpkg_installed/include" >> $env:GITHUB_ENV
          echo "LIB=$vcpkg_installed/lib" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLED_ROOT=${{ github.workspace }}/vcpkg_installed" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          # Define explicitamente VCPKG_ROOT para o script python
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          python build.py --flutter --hwcodec --portable

      - name: Rename and Upload Artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Filter "rustdesk-*-install.exe" | Select-Object -First 1
          if ($exe) {
            Rename-Item -Path $exe.FullName -NewName "${{ env.OUTPUT_NAME }}_Setup.exe"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: |
            ${{ env.OUTPUT_NAME }}_Setup.exe
