name: Build GrupoND Versions

on:
  workflow_dispatch:
    inputs:
      rs_server:
        description: 'Endereço do Servidor ID/Relay (ex: rustdesk.grupond.com.br)'
        required: true
        default: 'SEU_IP_OU_DOMINIO'

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"

jobs:
  build-windows:
    name: Build Windows Versions
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        version: [client, admin]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        shell: pwsh
        run: |
          if ("${{ matrix.version }}" -eq "client") {
            echo "APP_NAME=Atendimento GrupoND" >> $env:GITHUB_ENV
            echo "RS_INCOMING_ONLY=1" >> $env:GITHUB_ENV
            echo "RS_DISABLE_SETTINGS=1" >> $env:GITHUB_ENV
            echo "OUTPUT_NAME=Atendimento_GrupoND" >> $env:GITHUB_ENV
          } else {
            echo "APP_NAME=Admin GrupoND" >> $env:GITHUB_ENV
            echo "RS_HIDE_NETWORK=1" >> $env:GITHUB_ENV
            echo "OUTPUT_NAME=Admin_GrupoND" >> $env:GITHUB_ENV
          }
          echo "RS_SERVER=${{ github.event.inputs.rs_server }}" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup vcpkg and Install Dependencies
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          # Instalamos TODAS as dependências necessárias, incluindo o FFmpeg com os plugins de hardware
          ./vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static ffmpeg[amf,nvcodec,qsv]:x64-windows-static libjpeg-turbo:x64-windows-static

      - name: Build
        shell: pwsh
        run: |
          # O arquivo .cargo/config.toml já configuramos para apontar VCPKG_ROOT = "C:/vcpkg"
          # que é o padrão do windows-2022 runner.
          python build.py --flutter --hwcodec --portable

      - name: Rename and Upload Artifact
        shell: pwsh
        run: |
          # Localiza o executável gerado (geralmente rustdesk-VERSION-install.exe)
          $exe = Get-ChildItem -Filter "rustdesk-*-install.exe" | Select-Object -First 1
          if ($exe) {
            Rename-Item -Path $exe.FullName -NewName "${{ env.OUTPUT_NAME }}_Setup.exe"
            echo "FINAL_EXE=${{ env.OUTPUT_NAME }}_Setup.exe" >> $env:GITHUB_ENV
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: |
            ${{ env.OUTPUT_NAME }}_Setup.exe
