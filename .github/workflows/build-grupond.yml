name: Build GrupoND Versions

on:
  workflow_dispatch:
    inputs:
      rs_server:
        description: 'Endereço do Servidor ID/Relay (ex: rustdesk.grupond.com.br)'
        required: true
        default: 'SEU_IP_OU_DOMINIO'

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-windows:
    name: Build Windows Versions
    runs-on: windows-2022
    env:
      VCPKG_ROOT: "C:/vcpkg"
      VCPKG_DEFAULT_TRIPLET: "x64-windows-static"
      VCPKG_ALLOW_TRIPLET_MISMATCH: "1"
    strategy:
      fail-fast: false
      matrix:
        version: [client, admin]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        shell: pwsh
        run: |
          if ("${{ matrix.version }}" -eq "client") {
            "APP_NAME=Atendimento GrupoND" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "RS_INCOMING_ONLY=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "RS_DISABLE_SETTINGS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "OUTPUT_NAME=Atendimento_GrupoND" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $slug = "atendimento-grupond"
          } else {
            "APP_NAME=Admin GrupoND" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "RS_HIDE_NETWORK=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "OUTPUT_NAME=Admin_GrupoND" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $slug = "admin-grupond"
          }
          "RS_SERVER=${{ github.event.inputs.rs_server }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          
          # Update Cargo.toml
          (Get-Content Cargo.toml) -replace 'name = "rustdesk"', ('name = "' + $slug + '"') `
                                   -replace 'default-run = "rustdesk"', ('default-run = "' + $slug + '"') | Set-Content Cargo.toml
          
          # Add explicit bin target to Cargo.toml to ensure the renamed package builds a binary
          $binSection = "`n[[bin]]`nname = `"$slug`"`npath = `"src/main.rs`"`n"
          Add-Content -Path Cargo.toml -Value $binSection

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup vcpkg
        shell: pwsh
        run: |
          cd C:\vcpkg
          # Install dependencies with explicit features for ffmpeg
          ./vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static ffmpeg[core,avcodec,avdevice,avfilter,avformat,swresample,swscale]:x64-windows-static
          ./vcpkg.exe integrate install

      - name: Build
        shell: pwsh
        run: |
          # Sync name in Flutter
          (Get-Content flutter/pubspec.yaml) -replace 'name: rustdesk', ('name: ' + "${{ env.OUTPUT_NAME }}".ToLower().Replace('_', '-')) | Set-Content flutter/pubspec.yaml
          
          # Compila a versão personalizada com Flutter e gera o executável portátil (Single EXE)
          python build.py --flutter --hwcodec --portable
          
          # Rename the final executable
          Get-ChildItem -Filter "rustdesk-*-install.exe" | Rename-Item -NewName "${{ env.OUTPUT_NAME }}_Setup.exe"

      - name: Rename and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: |
            ${{ env.OUTPUT_NAME }}_Setup.exe
