name: Build GrupoND Versions

on:
  workflow_dispatch:
    inputs:
      rs_server:
        description: 'Endereço do Servidor ID/Relay (ex: rustdesk.grupond.com.br)'
        required: true
        default: 'SEU_IP_OU_DOMINIO'

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  # Variáveis para o vcpkg do RustDesk
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-windows:
    name: Build Windows Versions
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        version: [client, admin]

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        shell: pwsh
        run: |
          if ("${{ matrix.version }}" -eq "client") {
            echo "APP_NAME=Atendimento GrupoND" >> $env:GITHUB_ENV
            echo "RS_INCOMING_ONLY=1" >> $env:GITHUB_ENV
            echo "RS_DISABLE_SETTINGS=1" >> $env:GITHUB_ENV
            echo "OUTPUT_NAME=Atendimento_GrupoND" >> $env:GITHUB_ENV
          } else {
            echo "APP_NAME=Admin GrupoND" >> $env:GITHUB_ENV
            echo "RS_HIDE_NETWORK=1" >> $env:GITHUB_ENV
            echo "OUTPUT_NAME=Admin_GrupoND" >> $env:GITHUB_ENV
          }
          echo "RS_SERVER=${{ github.event.inputs.rs_server }}" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build
        shell: pwsh
        run: |
          # Define VCPKG_ROOT explicitamente para o ambiente atual
          $env:VCPKG_ROOT = "C:\vcpkg"
          python build.py --flutter --hwcodec --portable

      - name: Rename and Upload Artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Filter "rustdesk-*-install.exe" | Select-Object -First 1
          if ($exe) {
            Rename-Item -Path $exe.FullName -NewName "${{ env.OUTPUT_NAME }}_Setup.exe"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: |
            ${{ env.OUTPUT_NAME }}_Setup.exe
