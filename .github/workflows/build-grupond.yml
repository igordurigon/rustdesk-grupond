name: Build GrupoND Versions

on:
  workflow_dispatch:
    inputs:
      rs_server:
        description: 'Endereço do Servidor ID/Relay (ex: rustdesk.grupond.com.br)'
        required: true
        default: 'SEU_IP_OU_DOMINIO'

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-windows:
    name: Build Windows Versions
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: 'x64-windows-static'
      VCPKG_ALLOW_TRIPLET_MISMATCH: "1"
      # Flags para resolver erros de exceção C++ no hwcodec
      CL: "/EHsc /d2FH4-"
    strategy:
      fail-fast: false
      matrix:
        version: [client, admin]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        shell: pwsh
        run: |
          if ("${{ matrix.version }}" -eq "client") {
            Add-Content -Path $env:GITHUB_ENV -Value "APP_NAME=Atendimento GrupoND"
            Add-Content -Path $env:GITHUB_ENV -Value "RS_INCOMING_ONLY=1"
            Add-Content -Path $env:GITHUB_ENV -Value "RS_DISABLE_SETTINGS=1"
            Add-Content -Path $env:GITHUB_ENV -Value "OUTPUT_NAME=Atendimento_GrupoND"
            $slug = "atendimento-grupond"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "APP_NAME=Admin GrupoND"
            Add-Content -Path $env:GITHUB_ENV -Value "RS_HIDE_NETWORK=1"
            Add-Content -Path $env:GITHUB_ENV -Value "OUTPUT_NAME=Admin_GrupoND"
            $slug = "admin-grupond"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "RS_SERVER=${{ github.event.inputs.rs_server }}"
          
          # Define VCPKG_ROOT dinamicamente
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          
          # Update Cargo.toml
          (Get-Content Cargo.toml) -replace 'name = "rustdesk"', ('name = "' + $slug + '"') `
                                   -replace 'default-run = "rustdesk"', ('default-run = "' + $slug + '"') | Set-Content Cargo.toml
          
          # Add explicit bin target to Cargo.toml
          $binSection = "`n[[bin]]`nname = `"$slug`"`npath = `"src/main.rs`"`n"
          Add-Content -Path Cargo.toml -Value $binSection

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup vcpkg
        shell: pwsh
        run: |
          # Novo diretório para forçar cache bust
          $installRoot = "${{ github.workspace }}/vcpkg_new"
          if (!(Test-Path $installRoot)) { New-Item -ItemType Directory -Path $installRoot }
          
          if (Test-Path "vcpkg.json") { Rename-Item "vcpkg.json" "vcpkg.json.bak" }
          
          cd $env:VCPKG_INSTALLATION_ROOT
          
          # COMANDO SIMPLIFICADO E CORRIGIDO
          $vcpkgCmd = "./vcpkg.exe install --triplet x64-windows-static --x-install-root=`"$installRoot`" --overlay-ports=`"${{ github.workspace }}/res/vcpkg`" libvpx libyuv opus aom ffmpeg[amf,nvcodec,qsv] ffnvcodec amd-amf mfx-dispatch"
          
          Write-Host "EXECUTANDO: $vcpkgCmd"
          Invoke-Expression $vcpkgCmd
          
          ./vcpkg.exe integrate install
          
          # Localiza headers
          $ffmpegHeader = Get-ChildItem -Path $installRoot -Recurse -Filter "avcodec.h" | Select-Object -First 1
          if ($ffmpegHeader) {
            $includePath = $ffmpegHeader.Directory.Parent.FullName
            $libPath = $ffmpegHeader.Directory.Parent.Parent.FullName + "/lib"
            Write-Host "SUCCESS: Encontrado FFmpeg em $includePath"
            Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$includePath"
            Add-Content -Path $env:GITHUB_ENV -Value "LIB=$libPath"
            Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          } else {
            Write-Host "ERROR: Headers não encontrados!"
            Get-ChildItem -Path $installRoot -Recurse | Select-Object FullName
            exit 1
          }

      - name: Verify Environment
        shell: pwsh
        run: |
          Write-Host "INCLUDE: $env:INCLUDE"
          Write-Host "LIB: $env:LIB"
          if (Test-Path "$env:INCLUDE/libavcodec/avcodec.h") {
            Write-Host "Headers verificados com sucesso!"
          } else {
            Write-Host "ERRO: Headers não encontrados no caminho final!"
            exit 1
          }
          # Restaura o vcpkg.json
          if (Test-Path "vcpkg.json.bak") { Rename-Item "vcpkg.json.bak" "vcpkg.json" }

      - name: Build
        shell: pwsh
        run: |
          # Sync name in Flutter
          (Get-Content flutter/pubspec.yaml) -replace 'name: rustdesk', ('name: ' + "${{ env.OUTPUT_NAME }}".ToLower().Replace('_', '-')) | Set-Content flutter/pubspec.yaml
          
          # Compila a versão personalizada com Flutter e gera o executável portátil (Single EXE)
          python build.py --flutter --hwcodec --portable
          
          # Rename the final executable
          Get-ChildItem -Filter "rustdesk-*-install.exe" | Rename-Item -NewName "${{ env.OUTPUT_NAME }}_Setup.exe"

      - name: Rename and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: |
            ${{ env.OUTPUT_NAME }}_Setup.exe
